---
name: make release

# manual workflow to make a new release for the default branch
on:
  workflow_dispatch:
    branches:
      - FRAMEWORK_6_0

jobs:
  run:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: ['ubuntu-22.04']
        php-versions: ['8.3']
    steps:
    - name: Setup git
      run:  |
          mkdir -p ~/.ssh/ && ssh-keyscan -t rsa github.com > ~/.ssh/known_hosts
          git config --global user.name "Github CI Runner"
          git config --global user.email "ci-job@maintaina.com"
    - name: Checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0
        ref: FRAMEWORK_6_0
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: gettext
        ini-values: post_max_size=512M, max_execution_time=360
        tools: composer:v2
    - name: Setup composer
      run: |
          composer config -g github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}
          #composer global config repositories.0 composer https://horde-satis.maintaina.com

          # Allow Horde installer plugin
          composer global config --no-plugins allow-plugins.horde/horde-installer-plugin true

          composer global config minimum-stability dev
          composer global require horde/components "dev-FRAMEWORK_6_0"
          alias horde-components="~/.config/composer/web/components/bin/horde-components"
    - name: write changelog
      run: |
          entries_amount=0; max_entries=100

          declare -a feat_commits fix_commits other_commits

          for commit in $(git rev-list FRAMEWORK_6_0)
          do
            msg=$(git log --format=%B -n 1 $commit | head -n 1)
            if [[ $msg == 'Release '* ]]; then break; fi
            if [[ $msg == 'Released'* ]]; then break; fi
            if [[ $msg == 'Development mode for'* ]]; then break; fi
            if [[ $msg == 'Merge '* ]]; then continue; fi

            if [[ -z "$msg" ]]; then continue; fi

            if [[ $msg =~ ^([a-z]+):[[:space:]]*(.*) ]]; then
              prefix="${BASH_REMATCH[1]}"
              clean_msg="${BASH_REMATCH[2]}"
            else
              prefix=""
              clean_msg="$msg"
            fi

            if [[ $prefix == "feat" ]]; then
              feat_commits+=("$clean_msg")
            elif [[ $prefix == "fix" ]]; then
              fix_commits+=("$clean_msg")
            else
              # restore unknown non-empty prefix so it's not lost
              [[ -z $prefix || $prefix == "chore" ]] || clean_msg="$prefix: $clean_msg"
              other_commits+=("$clean_msg")
            fi
            let "entries_amount+=1"

            if [ $entries_amount -gt $max_entries ]; then break; fi
          done

          release_msg=""

          if [ ${#feat_commits[@]} -gt 0 ]; then
            release_msg+="New Features:\n"
            for msg in "${feat_commits[@]}"; do
              release_msg+="  - $msg\n"
            done
            release_msg+="\n"
          fi

          if [ ${#fix_commits[@]} -gt 0 ]; then
            release_msg+="Fixes:\n"
            for msg in "${fix_commits[@]}"; do
              release_msg+="  - $msg\n"
            done
            release_msg+="\n"
          fi

          if [ ${#other_commits[@]} -gt 0 ]; then
            release_msg+="Other:\n"
            for msg in "${other_commits[@]}"; do
              release_msg+="  - $msg\n"
            done
          fi

          echo -e "$release_msg"

          echo horde-components -c doc/components.conf changed "$release_msg"

    - name: make release and push
      run: |
          echo horde-components -c doc/components.conf release for upstream
          echo git push
          echo git push origin --tags
